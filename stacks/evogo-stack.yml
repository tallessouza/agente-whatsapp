version: "3.8"
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: evogo, POSTGRES_USER: evogo, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}}
    volumes: [evogo_postgres:/var/lib/postgresql/data]
    networks: [ai_stack]
    deploy: {placement: {constraints: [node.role == manager]}}
  evolution:
    image: evoapicloud/evolution-go:latest
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}
      POSTGRES_AUTH_DB: postgresql://evogo:${SENHA}@postgres:5432/evogo?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evogo:${SENHA}@postgres:5432/evogo?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      WADEBUG: INFO
      LOGTYPE: console
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      WEBHOOK_URL: http://bridge:8080/evolution/webhook
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "false"
      MINIO_ENABLED: "false"
    volumes: [evogo_data:/app/dbdata, evogo_logs:/app/logs]
    networks: [ai_stack]
    ports: [{target: 4000, published: 4000, protocol: tcp, mode: host}]
    deploy: {replicas: 1, placement: {constraints: [node.role == manager]}, restart_policy: {condition: on-failure}}
volumes:
  evogo_postgres: {name: evogo_postgres}
  evogo_data: {name: evogo_data}
  evogo_logs: {name: evogo_logs}
networks:
  ai_stack: {external: true}
