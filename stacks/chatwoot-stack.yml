version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: chatwoot_production, POSTGRES_USER: chatwoot, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}}
    volumes: [chatwoot_postgres:/var/lib/postgresql/data]
    networks: [ai_stack]
    deploy: {placement: {constraints: [node.role == manager]}}
  redis:
    image: redis:7-alpine
    volumes: [chatwoot_redis:/data]
    networks: [ai_stack]
    deploy: {placement: {constraints: [node.role == manager]}}
  prepare:
    image: chatwoot/chatwoot:v4.18.0
    environment: &env
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: https://chatwoot.talles.dev
      FORCE_SSL: "true"
      ENABLE_ACCOUNT_SIGNUP: "true"
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot_production
    volumes: [chatwoot_storage:/app/storage]
    networks: [ai_stack]
    entrypoint: ["sh", "-lc"]
    command: ["bundle exec rails db:chatwoot_prepare"]
    deploy: {restart_policy: {condition: none}, placement: {constraints: [node.role == manager]}}
  rails:
    image: chatwoot/chatwoot:v4.18.0
    environment: *env
    volumes: [chatwoot_storage:/app/storage]
    networks: [ai_stack]
    ports: [{target: 3000, published: 3001, protocol: tcp, mode: host}]
    entrypoint: ["docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    deploy: {replicas: 1, placement: {constraints: [node.role == manager]}, restart_policy: {condition: on-failure}}
  sidekiq:
    image: chatwoot/chatwoot:v4.18.0
    environment: *env
    volumes: [chatwoot_storage:/app/storage]
    networks: [ai_stack]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    deploy: {replicas: 1, placement: {constraints: [node.role == manager]}, restart_policy: {condition: on-failure}}
volumes:
  chatwoot_postgres: {name: chatwoot_postgres}
  chatwoot_redis: {name: chatwoot_redis}
  chatwoot_storage: {name: chatwoot_storage}
networks:
  ai_stack: {external: true}
