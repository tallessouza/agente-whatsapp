version: "3.8"
services:
  hermes:
    image: hermes-agent:latest
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
    volumes: [hermes_data:/opt/data]
    networks: [ai_stack]
    ports: [{target: 8642, published: 8642, protocol: tcp, mode: host}]
    command: ["gateway", "run"]
    deploy: {replicas: 1, placement: {constraints: [node.role == manager]}, restart_policy: {condition: on-failure}}
volumes:
  hermes_data: {name: hermes_chatwoot_data}
networks:
  ai_stack: {external: true}
